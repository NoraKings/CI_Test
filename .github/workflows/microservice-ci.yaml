#Here, this is where the actual file is going to be called by the trigger.yaml file using the workflow_call keyword with inputs from that worfklow.
name: Microservice CI

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string

jobs:
  build:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo service name
        run: |
          echo "Service: ${{ inputs.service }}"

      - name: Build Docker image
        run: |
          docker build -t ${{ inputs.service }} ./src/${{ inputs.service }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
            image-ref: ${{ inputs.service }}
            format: table
            exit-code: '1'
            ignore-unfixed: true
            severity: CRITICAL,HIGH

      - name: Push image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag ${{ inputs.service }} ghcr.io/$OWNER_LC/microservices-demo/${{ inputs.service }}:latest
          docker push ghcr.io/$OWNER_LC/microservices-demo/${{ inputs.service }}:latest
